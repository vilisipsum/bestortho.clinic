<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c3-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="c3-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2744" />
      <stop offset="100%" stop-color="#16335B" />
    </linearGradient>
  </defs>

  <!-- ICON MARK (Surgical Authority Crest) -->
  <g transform="translate(15, 8)">
    <!-- Modern Shield Outline -->
    <path d="M 45,2 L 82,14 C 82,48 66,74 45,86 C 24,74 8,48 8,14 Z" 
          fill="url(#c3-shield)" stroke="#0D9488" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner Cross / Vertebral Alignment -->
    <path d="M 45,18 L 45,68 M 28,38 L 62,38" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Central Joint Articulation Nodes -->
    <circle cx="45" cy="38" r="5" fill="#38BDF8" />
    <circle cx="45" cy="24" r="3" fill="#A7F3D0" />
    <circle cx="45" cy="54" r="3" fill="#A7F3D0" />
    <circle cx="34" cy="38" r="3" fill="#A7F3D0" />
    <circle cx="56" cy="38" r="3" fill="#A7F3D0" />

    <!-- Laurel / Preservation Leaves at Base -->
    <path d="M 28,62 C 34,70 42,74 45,76 C 48,74 56,70 62,62" 
          fill="none" stroke="url(#c3-gold)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(125, 0)">
    <text x="0" y="30" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#0D9488">
      CENTRE FOR JOINT REPLACEMENT
    </text>

    <text x="0" y="60" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#0F2744">
      DR. GAURAV <tspan fill="#0D9488">SHARMA</tspan>
    </text>

    <text x="0" y="80" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#475569">
      MS (ORTHOPAEDICS) • GOLD MEDALIST
    </text>

    <text x="0" y="94" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="#64748B">
      Dr. Sharma's Clinic, Sikandra, Agra • bestortho.clinic
    </text>
  </g>
</svg>