<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c1-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="c1-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2744" />
      <stop offset="100%" stop-color="#1B4965" />
    </linearGradient>
    <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON MARK (Left, 90x90 centered in 100px height) -->
  <g transform="translate(10, 5)">
    <!-- Base Letter G Outer Arc -->
    <path d="M 68,14 C 42,14 20,32 16,56 C 12,78 28,94 54,94 C 74,94 88,82 90,64 L 54,64 L 54,50 L 104,50 C 105,74 88,106 50,106 C 18,106 -4,82 1,48 C 6,18 34,-2 70,-2 C 86,-2 98,4 106,12 L 94,24 C 88,18 78,14 68,14 Z" 
          fill="url(#c1-navy)" />

    <!-- Anatomical Knee Articulation Inside the G Curve -->
    <!-- Femoral Condyle Arc (Upper Joint) -->
    <path d="M 38,20 C 44,28 42,42 34,48 C 30,52 22,54 20,48 C 18,42 24,30 32,22 Z" 
          fill="url(#c1-teal)" filter="url(#c1-glow)" />

    <!-- Patella / Synovial Joint Center -->
    <ellipse cx="44" cy="50" rx="7" ry="9" fill="#06B6D4" opacity="0.9" />

    <!-- Tibial Plateau / Lower Leg Shaft (Lower Joint) -->
    <path d="M 36,54 C 42,54 46,60 44,68 C 42,78 30,86 24,84 C 20,82 22,70 28,62 C 30,58 33,54 36,54 Z" 
          fill="url(#c1-teal)" />

    <!-- Joint Space Dynamic Light Line -->
    <path d="M 28,48 Q 40,46 48,52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(125, 0)">
    <!-- DR. prefix -->
    <text x="0" y="32" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#0D9488">
      DR.
    </text>
    <line x1="36" y1="28" x2="160" y2="28" stroke="#0D9488" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- GAURAV SHARMA (Primary Name - Guaranteed Correct Spelling) -->
    <text x="0" y="60" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="#0F2744">
      GAURAV <tspan fill="#0D9488">SHARMA</tspan>
    </text>

    <!-- Subtitle / Specialty -->
    <text x="0" y="80" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#475569">
      ORTHOPAEDICS &amp; JOINT REPLACEMENT
    </text>

    <!-- Subtle Web Portal Tag -->
    <text x="0" y="94" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#0D9488">
      SIKANDRA, AGRA <tspan fill="#94A3B8">•</tspan> bestortho.clinic
    </text>
  </g>
</svg>